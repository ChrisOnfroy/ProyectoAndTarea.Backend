# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - proyectandtask

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: Run tests
        run: dotnet test proyectandtask.slnx --configuration Release --no-build

      - name: dotnet publish
        run: dotnet publish src/Proyectandtask.Api/Proyectandtask.Api.csproj -c Release -o ${{ env.DOTNET_ROOT }}/myapp

      - name: Create migration bundle
        env:
          # Cadena de relleno: la factory la exige, pero aquí no se conecta
          ConnectionStrings__DefaultConnection: "Host=localhost;Database=build;Username=build"
        run: |
          dotnet tool install --global dotnet-ef --version "10.0.*"
          dotnet ef migrations bundle \
            --project src/Proyectoandtask.Infrastructure \
            --startup-project src/Proyectoandtask.Infrastructure \
            --configuration Release \
            --self-contained -r linux-x64 \
            -o efbundle

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ env.DOTNET_ROOT }}/myapp

      - name: Upload migration bundle
        uses: actions/upload-artifact@v4
        with:
          name: efbundle
          path: efbundle

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: app

      - name: Download migration bundle
        uses: actions/download-artifact@v4
        with:
          name: efbundle
          path: ef

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_29512B28503E44D78212EA5839608546 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_47E099947B104CA7937B3C6B707A138F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B5EC0BDAFDE74AD39C85C26B62C84402 }}

      - name: Apply database migrations
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRING }}
        run: |
          chmod +x ef/efbundle
          ./ef/efbundle

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'proyectandtask'
          slot-name: 'Production'
          package: app
