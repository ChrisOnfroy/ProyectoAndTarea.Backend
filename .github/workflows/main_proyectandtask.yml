name: Build and deploy ASP.NET Core app to Azure Web App - proyectandtask

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and Publish API
        run: |
          dotnet restore src/Proyectandtask.Api/Proyectandtask.Api.csproj
          dotnet publish src/Proyectandtask.Api/Proyectandtask.Api.csproj -c Release -o ./publish --no-restore

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'proyectandtask'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './publish'
